# Render Blueprint — defines the free web service.
# NOTE: Render restricted Blueprint/Infra-as-Code to paid plans, so for
# the free tier you must create the Web Service manually (New + → Web
# Service) and copy the env vars below into the Environment section.
# This file is still useful as a reference + for future paid-plan use.
#
# Provider: NVIDIA NIM
# Endpoint: https://integrate.api.nvidia.com/v1/chat/completions (default)
# Model:    deepseek-ai/deepseek-v4-pro
# Key env:  NVIDIA_API_KEY
#
# Required secrets to add manually in Render dashboard:
#   NVIDIA_API_KEY     — your NVIDIA NIM API key (nvapi-...)

services:
  - type: web
    name: vantageo
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: true

    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      cd frontend && npm install --no-audit --no-fund && npm run build

    startCommand: uvicorn app:APP --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      # --- Runtime configuration ---
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: VANTAGEO_DATA_BACKEND
        value: json
      - key: VANTAGEO_LLM_PROVIDER
        value: nvidia
      - key: VANTAGEO_LLM_MODEL
        value: deepseek-ai/deepseek-v4-pro
      - key: CORS_ORIGINS
        value: "*"
      - key: VANTAGEO_LOG_JSON
        value: "0"

      # --- Secrets (sync: false means set in Render dashboard) ---
      - key: NVIDIA_API_KEY
        sync: false
